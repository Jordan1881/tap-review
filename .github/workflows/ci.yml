name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SESSION_SECRET: ci-session-secret-at-least-32-chars!!
  DATABASE_URL: postgresql://tapreview:tapreview@127.0.0.1:5432/tapreview
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Railway GitHub integration deploys from main. This job does not run
  # `railway up` — that would double-deploy. It only records that CI passed
  # and Railway will pick up the commit.
  railway:
    name: railway
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Railway deploys main via GitHub integration
        run: |
          echo "CI passed on main (${GITHUB_SHA})."
          echo "Railway GitHub integration will deploy this commit."
          echo "No railway up from Actions — avoids a double deploy."
