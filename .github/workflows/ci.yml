name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Dummy values so production env assertions pass at build time.
# Postgres below is the real CI database for migrate + E2E + /health.
env:
  SESSION_SECRET: ci-session-secret-at-least-32-chars!!
  DATABASE_URL: postgresql://tapreview:tapreview@127.0.0.1:5432/tapreview
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapreview
          POSTGRES_PASSWORD: tapreview
          POSTGRES_DB: tapreview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapreview -d tapreview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and health checks
        run: npm run test:e2e
